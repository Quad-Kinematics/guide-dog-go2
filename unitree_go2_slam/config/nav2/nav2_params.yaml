# Nav2 parameters for the Unitree Go2 (CHAMP gait) in Gazebo, tuned from the Nav2 Jazzy defaults.
# Lines marked "Go2:" differ from those defaults; everything else is stock.

amcl:
  ros__parameters:
    # Go2: odometry is Gazebo ground truth through the EKF, so motion noise is far lower than on
    # hardware. Raise these back towards 0.2 before using this file on the real robot.
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 30.0  # Go2: the range_max of pointcloud_to_laserscan
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 90  # Go2: more beams per update; the flattened VLP-16 scan has ~720
    max_particles: 1000  # Go2: good odometry and a known start need fewer particles
    min_particles: 200
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    # Go2: the omni model even for forward-only control. The differential model derives a
    # bearing from every translation over 1 cm, and the trunk sways 1-3 cm sideways per step,
    # so turning on the spot injected random heading noise: the heading spread reached 90 deg
    # and AMCL's heading swung by up to 48 deg at a time.
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    # Go2: the robot spawns at the map origin, so no "2D Pose Estimate" click is needed.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    sigma_hit: 0.2
    tf_broadcast: true
    # Go2: map -> odom is stamped this far in the future, which is also how late RViz shows each
    # correction. 0.5 s still covers several 10 Hz scans.
    transform_tolerance: 0.5
    # Go2: update twice as often so each correction is smaller (less visible jumping).
    update_min_a: 0.1
    update_min_d: 0.1
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # Go2: Nav2's default trees, adapted (see the comment at the top of each file). To pose: walk
    # to the goal, then turn on the spot to its heading, and stop replanning while arriving.
    # Through poses: name the arrival goal checker, end with any heading.
    default_nav_to_pose_bt_xml: "$(find-pkg-share unitree_go2_slam)/config/nav2/navigate_to_pose_go2.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share unitree_go2_slam)/config/nav2/navigate_through_poses_go2.xml"

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

# Go2: navigate_to_pose_go2.xml stops replanning within this radius of the goal (its GoalReached
# condition reads the value from the navigator's helper node). It has to hold the 0.25 m arrival
# circle plus the up to 0.25 m the trot drifts while turning on the spot.
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    goal_reached_tol: 0.8

controller_server:
  ros__parameters:
    # Go2: a 0.3 m/s robot whose gait takes ~0.25 s to respond needs no more than 10 Hz.
    controller_frequency: 10.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    # Go2: the default 0.5 zeroes every sideways speed the Go2 can reach (max 0.25 m/s).
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    # Go2: navigate_to_pose_go2.xml arrives with general_goal_checker and FollowPath, then turns
    # to the goal heading with goal_heading_checker and TurnToGoal. Every FollowPath in a tree
    # must name its goal checker now that there are two.
    goal_checker_plugins: ["general_goal_checker", "goal_heading_checker"]
    controller_plugins: ["FollowPath", "TurnToGoal"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      # Go2: turning counts as progress (0.5 rad), so turning on the spot never trips this.
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.5
      required_movement_angle: 0.5
      movement_time_allowance: 15.0
    # Goal checker parameters
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      # Go2: arrival only; the heading is goal_heading_checker's job.
      yaw_goal_tolerance: 3.14
    goal_heading_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # Go2: the turn starts inside general_goal_checker's 0.25 m, so this latches on the first
      # cycle; it only needs margin over 0.25, and drift while turning no longer matters.
      xy_goal_tolerance: 0.4
      yaw_goal_tolerance: 0.15
    FollowPath:
      # Go2: chosen in trials against MPPI (forward-only, omnidirectional, and behind this shim).
      # MPPI seeds each prediction with the measured velocity, and the trot's sway swings the
      # measured turn rate by about +-0.3 rad/s every step, so it kept correcting turns that were
      # not happening: half as fast, 40% longer paths and less clearance. Pure pursuit walks
      # every leg at full speed.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # Rotation shim: turn on the spot towards the path once per goal (re-aiming at every replan
      # made it circle near goals), at CHAMP's 0.5 rad/s cap.
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.5
      max_angular_accel: 1.0
      # Go2: closed loop (the default) ramps each turn from the measured turn rate, so the command
      # backs off when the gait stumbles mid-turn. Open loop kept pushing 0.5 rad/s through such a
      # stall in one trial, and the robot rolled over.
      closed_loop: true
      simulate_ahead_time: 1.0
      rotate_to_heading_once: true
      rotate_to_goal_heading: false  # TurnToGoal does this
      # Regulated pure pursuit at CHAMP's walking speed (config/gait/gait.yaml caps it at 0.3).
      desired_linear_vel: 0.3
      lookahead_dist: 0.6
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.0
      lookahead_time: 1.5
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.1  # at 0.05 m/s CHAMP's steps are mostly sway
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.1
      use_rotate_to_heading: false  # the shim does this
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
    TurnToGoal:
      # Go2: the turn-on-the-spot phase at the goal. Same as FollowPath except that the shim turns
      # to the goal heading once inside goal_heading_checker's radius, and brakes earlier
      # (max_angular_accel 0.3): at 1.0 it still turned at 0.5 rad/s when the goal was accepted,
      # and the gait carried it 5-20 degrees past the heading. Open loop, because in closed loop
      # this low acceleration would let the trot's swaying turn rate drag the command down; the
      # top rate stays at 0.4 rad/s, under CHAMP's 0.5 cap, as margin instead. Pure pursuit only
      # runs if the robot is outside that radius, e.g. after a new goal arrives during the turn.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.4
      max_angular_accel: 0.3
      closed_loop: false
      simulate_ahead_time: 1.0
      rotate_to_heading_once: true
      rotate_to_goal_heading: true
      desired_linear_vel: 0.3
      lookahead_dist: 0.6
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.0
      lookahead_time: 1.5
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.1
      use_rotate_to_heading: false
      allow_reversing: false
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4  # Go2: keeps obstacle marks longer while the robot passes them (see blind zone)
      height: 4
      resolution: 0.05
      # Go2: trunk +-0.19 m, legs swing to about -0.3 m, D455 mount at +0.33 m, hips +-0.15 m.
      footprint: "[[0.36, 0.17], [0.36, -0.17], [-0.32, -0.17], [-0.32, 0.17]]"
      footprint_padding: 0.03
      # Go2: the map layer keeps mapped walls in the controller's view inside the lidar's blind
      # zone. The scan only adds unmapped obstacles, so a 2D obstacle layer replaces the voxels.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.70
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # Go2: the VLP-16 (0.2 m ahead of centre) sees nothing within 0.5 m of itself and
          # reports those beams as empty. The scan is in base_footprint, so never clear within
          # 0.7 m of the centre (or treat an empty beam as free), or the costmap erases the
          # obstacle the robot is about to touch.
          raytrace_max_range: 4.0
          raytrace_min_range: 0.7
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
          inf_is_valid: False
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[0.36, 0.17], [0.36, -0.17], [-0.32, -0.17], [-0.32, 0.17]]"  # Go2: as local
      footprint_padding: 0.03
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # Go2: see unmapped obstacles (the person) from further away so plans route around them
          # early; never clear inside the lidar's blind zone (see local_costmap).
          raytrace_max_range: 8.0
          raytrace_min_range: 0.7
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
          inf_is_valid: False
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
      always_send_full_costmap: True

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    # Go2: recovery spins within CHAMP's 0.5 rad/s cap.
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

route_server:
  ros__parameters:
    # The graph_filepath does not need to be specified since it going to be set by defaults in launch.
    # If you'd rather set it in the yaml, remove the default "graph" value in the launch file(s).
    # file & provide full path to map below. If graph config or launch default is provided, it is used
    # graph_filepath: $(find-pkg-share nav2_route)/graphs/aws_graph.geojson
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # Go2: CHAMP's caps and the controller's gentle accelerations, [x, y, theta].
    max_velocity: [0.3, 0.0, 0.5]
    min_velocity: [-0.15, 0.0, -0.5]
    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-0.5, 0.0, -1.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      # Go2: look 0.6 m ahead at full speed, past the lidar's 0.5 m blind zone, so obstacles are
      # seen before they become invisible.
      time_before_collision: 2.0
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

loopback_simulator:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan"  # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02
    scan_range_min: 0.05
    scan_range_max: 30.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true
